<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Real ou IA?</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--line:#2a2f3a;--txt:#f2f3f5;--mut:#9aa1ad;--acc:#7c5cff;--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100dvh}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:28px;text-align:center;margin:8px 0 4px}
.sub{color:var(--mut);text-align:center;margin-bottom:20px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin-bottom:10px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:14px 0;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--txt);font-size:18px;font-weight:700}
.seg button.on{background:var(--acc);border-color:var(--acc)}
.btn{display:block;width:100%;padding:16px;border-radius:14px;border:0;background:var(--acc);color:#fff;font-size:17px;font-weight:700;margin-top:10px;cursor:pointer}
.btn.sec{background:transparent;border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.grid div{aspect-ratio:1;border-radius:8px;background:#000 center/cover;border:1px dashed var(--line)}
.up{display:block;text-align:center;padding:14px;border:2px dashed var(--line);border-radius:12px;color:var(--mut);cursor:pointer}
.up input{display:none}
.tag{display:inline-block;font-size:12px;padding:3px 8px;border-radius:99px;margin-left:6px}
.tag.r{background:#16351f;color:var(--ok)}.tag.i{background:#2a2050;color:#b7a6ff}
.hint{color:var(--mut);font-size:13px;margin-top:8px}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.q{text-align:center;font-size:20px;font-weight:700;margin-bottom:12px}
.pair{display:flex;flex-direction:column;gap:12px}
.opt{position:relative;border-radius:16px;overflow:hidden;border:3px solid transparent;background:#000;cursor:pointer;padding:0}
.opt img{display:block;width:100%;max-height:38dvh;object-fit:contain}
.opt .lbl{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.65);padding:4px 10px;border-radius:99px;font-weight:700}
.opt .res{position:absolute;inset:auto 0 0 0;padding:8px;text-align:center;font-weight:800;font-size:18px;display:none}
.done .opt .res{display:block}
.opt.ai .res{background:rgba(124,92,255,.9)}.opt.real .res{background:rgba(34,197,94,.9)}
.opt.ok{border-color:var(--ok)}.opt.no{border-color:var(--bad)}
.fb{text-align:center;font-size:22px;font-weight:800;margin:12px 0 0;min-height:30px}
.big{font-size:64px;font-weight:900;text-align:center;margin:10px 0}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">

<section id="setup">
  <h1>🤖 Real ou IA?</h1>
  <p class="sub">Monte o jogo: suba as fotos reais e as feitas por IA.</p>
  <div class="card">
    <h2>1. Quantas rodadas?</h2>
    <div class="seg" id="seg"><button data-n="5" class="on">5</button><button data-n="8">8</button><button data-n="10">10</button></div>
    <p class="hint">Cada rodada mostra 1 imagem real e 1 de IA lado a lado.</p>
  </div>
  <div class="card">
    <h2>2. Imagens reais <span class="tag r">REAL</span> <span id="cr" class="hint"></span></h2>
    <label class="up">📷 Escolher fotos reais<input type="file" id="fr" accept="image/*" multiple></label>
    <div class="grid" id="gr"></div>
  </div>
  <div class="card">
    <h2>3. Imagens de IA <span class="tag i">IA</span> <span id="ci" class="hint"></span></h2>
    <label class="up">✨ Escolher imagens de IA<input type="file" id="fi" accept="image/*" multiple></label>
    <div class="grid" id="gi"></div>
  </div>
  <button class="btn" id="play" disabled>▶ Testar o jogo aqui</button>
  <button class="btn sec" id="exp" disabled>⬇ Baixar jogo (HTML para compartilhar)</button>
  <p class="hint" id="msg" style="text-align:center"></p>
</section>

<section id="game" class="hidden">
  <div class="top"><span id="rnd"></span><span id="pts"></span></div>
  <div class="bar"><i id="prog"></i></div>
  <p class="q">Qual foi feita por <b>IA</b>? 👇</p>
  <div class="pair" id="pair"></div>
  <p class="fb" id="fb"></p>
  <button class="btn hidden" id="next">Próxima →</button>
</section>

<section id="end" class="hidden">
  <h1>Resultado</h1>
  <div class="big" id="score"></div>
  <p class="sub" id="verdict"></p>
  <button class="btn" id="again">🔁 Jogar de novo</button>
  <button class="btn sec hidden" id="back">✏️ Editar imagens</button>
</section>

</div>
<script id="app">
(function(){
var SOURCE = '<!doctype html>\n' + document.documentElement.outerHTML;
var $ = function(id){return document.getElementById(id)};
var N = 5, REAL = [], AI = [], rounds = [], idx = 0, score = 0, embedded = !!window.GAME_DATA;

function show(id){['setup','game','end'].forEach(function(s){$(s).classList.toggle('hidden', s!==id)})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0;var t=a[i];a[i]=a[j];a[j]=t}return a}

// compress to keep the shared file small
function load(file){return new Promise(function(res){
  var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){
    var m=1200,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.src=fr.result};
  fr.readAsDataURL(file)})}

function refresh(){
  [['gr',REAL,'cr'],['gi',AI,'ci']].forEach(function(x){
    $(x[0]).innerHTML=x[1].map(function(u){return '<div style="background-image:url('+u+')"></div>'}).join('');
    $(x[2]).textContent=x[1].length+'/'+N});
  var ok=REAL.length>=N&&AI.length>=N;
  $('play').disabled=$('exp').disabled=!ok;
  $('msg').textContent=ok?'Pronto! Se subir mais que '+N+', as extras são sorteadas.':'Faltam '+Math.max(0,N-REAL.length)+' real(is) e '+Math.max(0,N-AI.length)+' de IA.';
}
function pick(input,arr){input.onchange=async function(){
  $('msg').textContent='Processando imagens…';
  for(var f of input.files) arr.push(await load(f));
  input.value='';refresh()}}

function build(){
  var r=shuffle(REAL).slice(0,N), a=shuffle(AI).slice(0,N);
  return r.map(function(u,i){return {real:u, ai:a[i], aiFirst:Math.random()<.5}});
}
function start(){rounds=build();idx=0;score=0;show('game');draw()}
function draw(){
  var r=rounds[idx], P=$('pair');
  P.classList.remove('done');$('fb').textContent='';$('next').classList.add('hidden');
  $('rnd').textContent='Rodada '+(idx+1)+' de '+rounds.length;$('pts').textContent='⭐ '+score;
  $('prog').style.width=(idx/rounds.length*100)+'%';
  var opts=r.aiFirst?[['ai',r.ai],['real',r.real]]:[['real',r.real],['ai',r.ai]];
  P.innerHTML=opts.map(function(o,i){return '<button class="opt '+o[0]+'" data-k="'+o[0]+'"><img src="'+o[1]+'"><span class="lbl">'+(i?'B':'A')+'</span><span class="res">'+(o[0]==='ai'?'🤖 IA':'📷 REAL')+'</span></button>'}).join('');
  P.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
    if(P.classList.contains('done'))return;P.classList.add('done');
    var hit=b.dataset.k==='ai';if(hit)score++;
    b.classList.add(hit?'ok':'no');if(!hit)P.querySelector('.ai').classList.add('ok');
    $('fb').textContent=hit?'✅ Acertou!':'❌ Errou! Essa era real.';
    $('pts').textContent='⭐ '+score;
    $('next').textContent=idx+1<rounds.length?'Próxima →':'Ver resultado';
    $('next').classList.remove('hidden');if(navigator.vibrate)navigator.vibrate(hit?30:[60,40,60]);
  }});
  window.scrollTo(0,0);
}
$('next').onclick=function(){idx++;if(idx<rounds.length)draw();else finish()};
function finish(){
  show('end');var p=score/rounds.length;
  $('score').textContent=score+' / '+rounds.length;
  $('verdict').textContent=p===1?'🏆 Perfeito! Ninguém te engana.':p>=.7?'👀 Olho afiado!':p>=.4?'🤔 Nada mal, mas a IA te pegou algumas vezes.':'🤖 A IA te enganou direitinho!';
}
$('again').onclick=start;
$('back').onclick=function(){show('setup')};

if(embedded){
  REAL=GAME_DATA.real;AI=GAME_DATA.ai;N=GAME_DATA.n;start();
}else{
  $('back').classList.remove('hidden');
  $('seg').querySelectorAll('button').forEach(function(b){b.onclick=function(){
    $('seg').querySelector('.on').classList.remove('on');b.classList.add('on');N=+b.dataset.n;refresh()}});
  pick($('fr'),REAL);pick($('fi'),AI);refresh();
  $('play').onclick=start;
  $('exp').onclick=function(){
    var data='<script>window.GAME_DATA='+JSON.stringify({n:N,real:REAL,ai:AI})+'<\/script>\n';
    var html=SOURCE.replace('<script id="app">',data+'<script id="app">');
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
    a.download='jogo-real-ou-ia.html';document.body.appendChild(a);a.click();a.remove();
    $('msg').textContent='Arquivo baixado! Envie pelo WhatsApp/e-mail ou suba no Netlify Drop / GitHub Pages.';
  };
}
})();
</script>
</body>
</html>
