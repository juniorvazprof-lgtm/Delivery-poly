<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quantos Heróis 3D</title>
<style>
:root{--tinta:#2a1a12;--papel:#fff4dc;--ouro:#f0b429;--verm:#d6453d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--tinta:#2a1a12;--papel:#fff4dc}}
:root[data-theme="dark"]{--tinta:#2a1a12;--papel:#fff4dc}
html,body{margin:0;height:100%;background:#7fc0e8;overflow:hidden;font-family:system-ui,sans-serif;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;pointer-events:none}
.chip{background:var(--papel);color:var(--tinta);border:3px solid var(--tinta);border-radius:12px;padding:4px 12px;font-weight:900;box-shadow:0 3px 0 var(--tinta);pointer-events:auto}
#placar{display:flex;gap:10px}
#acoes{position:fixed;right:16px;bottom:16px;display:flex;gap:8px}
button.chip{font-size:16px;cursor:pointer;min-height:44px}
#fim{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,10,5,.45)}
#fim div{background:var(--papel);border:4px solid var(--tinta);border-radius:18px;padding:18px 28px;text-align:center;font-weight:900;font-size:34px;color:var(--tinta)}
#gira{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#2a1a12;color:#fff4dc;font:900 20px system-ui;text-align:center;padding:16px}
@media (orientation:portrait){#gira{display:flex}}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="placar"><span class="chip" id="ph">⚔️ Heróis 0</span><span class="chip" id="pv">👺 Inimigos 0</span></div><span class="chip" id="tempo">0,0 s</span></div>
<div id="acoes"><button class="chip" id="vel">1x</button><button class="chip" id="reini">↻ Reiniciar</button></div>
<div id="fim"><div id="fimtxt"></div></div>
<div id="gira">Gire o celular para a horizontal 📱↻</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { criarBatalha, passo, DT } from './core/combate.js';

// ---------- cena ----------
const canvas = document.getElementById('c');
const r = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(Math.min(2, devicePixelRatio)); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
const cena = new THREE.Scene(); cena.background = new THREE.Color('#8fd0f0'); cena.fog = new THREE.Fog('#8fd0f0', 22, 48);
const cam = new THREE.PerspectiveCamera(38, 1, .1, 200);
cena.add(new THREE.HemisphereLight('#fff6e0', '#4a7a3a', 1.6));
const sol = new THREE.DirectionalLight('#fff1d0', 2.6); sol.position.set(-8, 16, 10); sol.castShadow = true;
sol.shadow.mapSize.set(2048, 2048); Object.assign(sol.shadow.camera, { left: -16, right: 16, top: 12, bottom: -12 }); sol.shadow.bias = -0.0005; cena.add(sol);
function redim() { const w = innerWidth, h = innerHeight; r.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
addEventListener('resize', redim); redim();

const mat = (c, o = {}) => new THREE.MeshToonMaterial({ color: c, ...o });
const toon = (geo, c, o) => { const m = new THREE.Mesh(geo, mat(c, o)); m.castShadow = true; return m; };
const rnd = (() => { let s = 11; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

// chão: grama com manchas + caminho de terra
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 512; const g = cv.getContext('2d');
  g.fillStyle = '#6cbf4a'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 900; i++) { g.fillStyle = ['#5fb043', '#78c955', '#64b847'][i % 3]; g.beginPath(); g.arc(rnd() * 512, rnd() * 512, 3 + rnd() * 9, 0, 7); g.fill(); }
  const tex = new THREE.CanvasTexture(cv); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(6, 4); tex.colorSpace = THREE.SRGBColorSpace;
  const chao = new THREE.Mesh(new THREE.PlaneGeometry(80, 50), new THREE.MeshToonMaterial({ map: tex })); chao.rotation.x = -Math.PI / 2; chao.receiveShadow = true; cena.add(chao);
  const terra = new THREE.Mesh(new THREE.CircleGeometry(1, 48), mat('#c9a46a')); terra.scale.set(15, 7.5, 1); terra.rotation.x = -Math.PI / 2; terra.position.y = .01; terra.receiveShadow = true; cena.add(terra);
  // cenário: árvores, pedras e cogumelos em volta da arena
  for (let i = 0; i < 46; i++) {
    const a = rnd() * 6.28, d = 17 + rnd() * 12; const x = Math.cos(a) * d * 1.25, z = Math.sin(a) * d * .75;
    const gq = new THREE.Group(); gq.position.set(x, 0, z);
    if (i % 3) { const tr = toon(new THREE.CylinderGeometry(.25, .35, 1.4, 7), '#8a5a35'); tr.position.y = .7; gq.add(tr);
      const copa = toon(new THREE.IcosahedronGeometry(1.3 + rnd() * .6, 0), ['#3f9a3a', '#4fae3f', '#2f8a3a'][i % 3]); copa.position.y = 2.2; gq.add(copa); }
    else { const p = toon(new THREE.DodecahedronGeometry(.5 + rnd() * .6, 0), '#9aa0a8'); p.position.y = .3; gq.add(p); }
    gq.rotation.y = rnd() * 6; cena.add(gq);
  }
  for (let i = 0; i < 30; i++) { const f = new THREE.Mesh(new THREE.SphereGeometry(.12, 6, 5), mat(['#ffe14a', '#ff7ab6', '#fff'][i % 3]));
    f.position.set((rnd() - .5) * 34, .08, (rnd() - .5) * 22); if (Math.abs(f.position.x) < 14 && Math.abs(f.position.z) < 7) continue; cena.add(f); }
}

// ---------- modelos chibi ----------
const PELE = '#ffd7b0';
function olhos(cab, r, cor = '#2a1a12') {
  for (const s of [-1, 1]) { const o = new THREE.Mesh(new THREE.SphereGeometry(r * .16, 10, 8), new THREE.MeshBasicMaterial({ color: cor }));
    o.scale.set(1, 1.35, .6); o.position.set(s * r * .34, -r * .05, r * .9); cab.add(o);
    const b = new THREE.Mesh(new THREE.SphereGeometry(r * .055, 6, 6), new THREE.MeshBasicMaterial({ color: '#fff' })); b.position.set(s * r * .34 + r * .04, r * .03, r * .97); cab.add(b); }
  for (const s of [-1, 1]) { const bo = new THREE.Mesh(new THREE.CircleGeometry(r * .13, 12), new THREE.MeshBasicMaterial({ color: '#ff9a9a', transparent: true, opacity: .6 }));
    bo.position.set(s * r * .58, -r * .3, r * .8); bo.rotation.y = s * .5; cab.add(bo); }
}
function corpoChibi({ roupa, pele = PELE, escala = 1, cabR = .62 }) {
  const g = new THREE.Group(), rig = new THREE.Group(); g.add(rig);
  const corpo = toon(new THREE.CapsuleGeometry(.36, .35, 6, 12), roupa); corpo.position.y = .62; rig.add(corpo);
  for (const s of [-1, 1]) { const p = toon(new THREE.CapsuleGeometry(.12, .16, 4, 8), '#5a3a2a'); p.position.set(s * .17, .2, 0); rig.add(p); }
  const bracos = [-1, 1].map(s => { const b = new THREE.Group(); b.position.set(s * .44, .85, 0); const m = toon(new THREE.CapsuleGeometry(.1, .22, 4, 8), roupa); m.position.y = -.17; b.add(m);
    const mao = toon(new THREE.SphereGeometry(.11, 8, 8), pele); mao.position.y = -.36; b.add(mao); rig.add(b); return b; });
  const cab = new THREE.Group(); cab.position.y = 1.32; rig.add(cab);
  cab.add(toon(new THREE.SphereGeometry(cabR, 24, 18), pele)); olhos(cab, cabR);
  g.scale.setScalar(escala);
  return { g, rig, cab, bracos, cabR };
}
function arma(tipo) {
  const g = new THREE.Group();
  if (tipo === 'espada') { const l = toon(new THREE.BoxGeometry(.09, .75, .04), '#dfe6ee', { emissive: '#223' }); l.position.y = -.6; g.add(l); const gd = toon(new THREE.BoxGeometry(.32, .06, .08), '#c9a227'); gd.position.y = -.24; g.add(gd); }
  if (tipo === 'escudo') { const e = toon(new THREE.CylinderGeometry(.42, .42, .08, 20), '#3e6fd8'); e.rotation.x = Math.PI / 2; e.position.set(0, -.35, .12); g.add(e);
    const b = toon(new THREE.CylinderGeometry(.14, .14, .1, 12), '#f0c34a'); b.rotation.x = Math.PI / 2; b.position.set(0, -.35, .17); g.add(b); }
  if (tipo === 'cajado' || tipo === 'cajadoLuz' || tipo === 'cajadoPena') { const c = toon(new THREE.CylinderGeometry(.04, .05, 1.3, 6), '#8a5a35'); c.position.y = -.3; g.add(c);
    const cor = tipo === 'cajado' ? '#ff7a1a' : tipo === 'cajadoLuz' ? '#fff3a0' : '#7ae0ff';
    const orb = new THREE.Mesh(new THREE.IcosahedronGeometry(.16, 1), new THREE.MeshBasicMaterial({ color: cor })); orb.position.y = .38; g.add(orb); g.userData.orb = orb; }
  if (tipo === 'arco') { const a = toon(new THREE.TorusGeometry(.42, .035, 6, 20, Math.PI), '#8a5a35'); a.rotation.z = Math.PI / 2; a.position.set(0, -.35, .1); g.add(a); }
  if (tipo === 'adaga') { const l = toon(new THREE.ConeGeometry(.06, .4, 6), '#c8ccd4'); l.rotation.x = Math.PI; l.position.y = -.5; g.add(l); }
  if (tipo === 'clava') { const c = toon(new THREE.CylinderGeometry(.16, .07, .9, 7), '#7a4a2a'); c.position.y = -.55; g.add(c); }
  return g;
}
function modelo(tipo) {
  let m;
  const H = { // heróis
    guerreiro: () => { m = corpoChibi({ roupa: '#d6453d' }); const el = toon(new THREE.SphereGeometry(.66, 20, 12, 0, 6.29, 0, 1.45), '#b8c0cc'); el.position.y = .05; m.cab.add(el);
      const crista = toon(new THREE.BoxGeometry(.08, .3, .7), '#d6453d'); crista.position.y = .62; m.cab.add(crista); m.bracos[1].add(arma('espada')); },
    guardiao: () => { m = corpoChibi({ roupa: '#3e6fd8', escala: 1.08 }); const el = toon(new THREE.CylinderGeometry(.6, .68, .55, 16), '#8b96a8'); el.position.y = .32; m.cab.add(el); m.bracos[0].add(arma('escudo')); m.bracos[1].add(arma('adaga')); },
    piromante: () => { m = corpoChibi({ roupa: '#e8742a' }); const ch = toon(new THREE.ConeGeometry(.6, 1.1, 16), '#6a2fb0'); ch.position.y = .78; ch.rotation.z = -.15; m.cab.add(ch);
      const aba = toon(new THREE.CylinderGeometry(.82, .82, .06, 20), '#6a2fb0'); aba.position.y = .32; m.cab.add(aba); m.bracos[1].add(arma('cajado')); },
    arqueiro: () => { m = corpoChibi({ roupa: '#3f9a4a' }); const cap = toon(new THREE.SphereGeometry(.68, 18, 12, 0, 6.29, 0, 1.7), '#2f7a3a'); cap.position.set(0, .02, -.06); m.cab.add(cap); m.bracos[0].add(arma('arco')); },
    clerigo: () => { m = corpoChibi({ roupa: '#f2eee4' }); const aur = new THREE.Mesh(new THREE.TorusGeometry(.42, .05, 8, 28), new THREE.MeshBasicMaterial({ color: '#ffe066' })); aur.rotation.x = Math.PI / 2; aur.position.y = .85; m.cab.add(aur);
      const ca = toon(new THREE.SphereGeometry(.66, 18, 12, 0, 6.29, 0, 1.2), '#f0c34a'); ca.position.y = .05; m.cab.add(ca); m.bracos[1].add(arma('cajadoLuz')); },
  };
  const V = { // vilões
    goblin: () => { m = corpoChibi({ roupa: '#6b4a2a', pele: '#7cc44a', escala: .82 }); for (const s of [-1, 1]) { const o = toon(new THREE.ConeGeometry(.16, .55, 6), '#7cc44a'); o.rotation.z = -s * 1.2; o.position.set(s * .7, .1, 0); m.cab.add(o); } m.bracos[1].add(arma('adaga')); },
    goblinArqueiro: () => { V.goblin(); const cap = toon(new THREE.ConeGeometry(.5, .5, 10), '#3d5a2a'); cap.position.y = .55; m.cab.add(cap); m.bracos[0].add(arma('arco')); },
    xamaGoblin: () => { V.goblin(); for (let i = 0; i < 3; i++) { const p = toon(new THREE.ConeGeometry(.06, .5, 5), ['#ff5a5a', '#ffe14a', '#5ac8ff'][i]); p.position.set((i - 1) * .16, .7, -.1); m.cab.add(p); } m.bracos[0].add(arma('cajadoPena')); },
    ogro: () => { m = corpoChibi({ roupa: '#7a5a3a', pele: '#a8b46a', escala: 1.55, cabR: .58 }); const pre = toon(new THREE.ConeGeometry(.07, .2, 6), '#fff8e0'); for (const s of [-1, 1]) { const p = pre.clone(); p.position.set(s * .2, -.32, .5); m.cab.add(p); } m.bracos[1].add(arma('clava')); },
    morcego: () => { m = { g: new THREE.Group(), rig: new THREE.Group(), bracos: [] }; m.g.add(m.rig); const c = toon(new THREE.SphereGeometry(.42, 16, 12), '#6a4aa8'); c.position.y = 1.4; m.rig.add(c); m.cab = c; olhos(c, .42, '#ffe14a');
      m.asas = [-1, 1].map(s => { const a = new THREE.Mesh(new THREE.CircleGeometry(.6, 3), mat('#4a2f88', { side: THREE.DoubleSide })); a.position.set(s * .42, 1.45, 0); a.rotation.set(0, 0, s * .3); m.rig.add(a); return a; }); },
    slime: (esc = 1) => { m = { g: new THREE.Group(), rig: new THREE.Group(), bracos: [] }; m.g.add(m.rig); const c = new THREE.Mesh(new THREE.SphereGeometry(.7, 24, 16), new THREE.MeshToonMaterial({ color: '#5fd16a', transparent: true, opacity: .85 }));
      c.scale.set(1, .78, 1); c.position.y = .55; c.castShadow = true; m.rig.add(c); m.cab = c; olhos(c, .7); m.g.scale.setScalar(esc); m.slime = c; },
    slimeMedio: () => V.slime(.75), slimePequeno: () => V.slime(.55),
    reiSlime: () => { V.slime(2.2); const co = toon(new THREE.CylinderGeometry(.3, .38, .3, 5, 1, true), '#f0c34a'); co.position.y = .78; m.cab.add(co); },
  };
  (H[tipo] || V[tipo] || H.guerreiro)();
  return m;
}

// barra de vida (sprite)
function barra() { const cv = document.createElement('canvas'); cv.width = 64; cv.height = 10; const t = new THREE.CanvasTexture(cv);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false })); s.scale.set(1.1, .17, 1); s.renderOrder = 10; s.userData = { cv, t, ult: -1 }; return s; }
function pintaBarra(s, f, lado) { if (Math.abs(s.userData.ult - f) < .01) return; s.userData.ult = f; const g = s.userData.cv.getContext('2d');
  g.fillStyle = '#2a1a12'; g.fillRect(0, 0, 64, 10); g.fillStyle = lado === 'h' ? '#5fd16a' : '#e0453d'; g.fillRect(2, 2, 60 * Math.max(0, f), 6); s.userData.t.needsUpdate = true; }
// números de dano
function numero(txt, cor) { const cv = document.createElement('canvas'); cv.width = 128; cv.height = 64; const g = cv.getContext('2d');
  g.font = '900 44px system-ui'; g.textAlign = 'center'; g.lineWidth = 8; g.strokeStyle = '#2a1a12'; g.strokeText(txt, 64, 46); g.fillStyle = cor; g.fillText(txt, 64, 46);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false, transparent: true })); s.scale.set(1, .5, 1); s.renderOrder = 11; return s; }

// ---------- batalha (motor real do jogo) ----------
const EXERCITO = { guerreiro: 3, guardiao: 2, piromante: 2, arqueiro: 2, clerigo: 1 };
const INIMIGOS = [['goblin', 8], ['goblinArqueiro', 3], ['slime', 2], ['morcego', 4], ['ogro', 1], ['xamaGoblin', 1]];
let b, vis, efeitos, eixo, velocidade = 1, acum = 0, tAnt = performance.now();
const raiz = new THREE.Group(); cena.add(raiz);
function iniciar() {
  raiz.clear(); vis = new Map(); efeitos = [];
  b = criarBatalha({ herois: EXERCITO, inimigos: INIMIGOS, semente: 7 });
  // eixo: heróis à esquerda, inimigos à direita (paisagem)
  const cH = media(b.unidades.filter(u => u.lado === 'h')), cV = media(b.unidades.filter(u => u.lado === 'v'));
  const dx = cV.x - cH.x, dy = cV.y - cH.y, n = Math.hypot(dx, dy) || 1;
  eixo = { ux: dx / n, uy: dy / n, cx: (cH.x + cV.x) / 2, cy: (cH.y + cV.y) / 2 };
  document.getElementById('fim').style.display = 'none';
}
function media(us) { const s = us.reduce((a, u) => ({ x: a.x + u.x, y: a.y + u.y }), { x: 0, y: 0 }); return { x: s.x / us.length, y: s.y / us.length }; }
const ESC = 0.2;
function mundo(x, y) { const rx = x - eixo.cx, ry = y - eixo.cy; return new THREE.Vector3((rx * eixo.ux + ry * eixo.uy) * ESC, 0, (-rx * eixo.uy + ry * eixo.ux) * ESC); }
function obterVis(u) {
  let v = vis.get(u.id); if (v) return v;
  const m = modelo(u.tipo); const bar = barra(); bar.position.y = (u.tipo === 'ogro' ? 3.6 : u.tipo === 'reiSlime' ? 3.4 : 2.3) / m.g.scale.x; m.g.add(bar);
  v = { m, bar, flash: 0, ataque: 0, morte: -1, pos: mundo(u.x, u.y), dir: u.lado === 'h' ? 1 : -1, fase: rnd() * 6 };
  m.g.position.copy(v.pos); m.g.rotation.y = v.dir > 0 ? Math.PI / 2 : -Math.PI / 2; raiz.add(m.g); vis.set(u.id, v); return v;
}
const projVis = new Map();
function efeito(tipo, p, extra = {}) {
  if (tipo === 'explosao' || tipo === 'meteoro') { const s = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), new THREE.MeshBasicMaterial({ color: '#ffb02e', transparent: true, opacity: .8 }));
    s.position.copy(p).setY(.4); raiz.add(s); efeitos.push({ obj: s, vida: .5, t: 0, tipo: 'bola', raio: (extra.raio || 2) * ESC * 1.2 }); }
  if (tipo === 'cura') { const s = new THREE.Mesh(new THREE.TorusGeometry(.5, .06, 8, 24), new THREE.MeshBasicMaterial({ color: '#fff3a0', transparent: true })); s.rotation.x = Math.PI / 2; s.position.copy(p).setY(.1); raiz.add(s); efeitos.push({ obj: s, vida: .7, t: 0, tipo: 'anel' }); }
  if (tipo === 'poeira') { for (let i = 0; i < 6; i++) { const s = new THREE.Mesh(new THREE.SphereGeometry(.18, 6, 5), mat('#e8dcc0')); s.position.copy(p).add(new THREE.Vector3(Math.cos(i) * .3, .2, Math.sin(i) * .3)); raiz.add(s); efeitos.push({ obj: s, vida: .6, t: 0, tipo: 'poeira', v: new THREE.Vector3(Math.cos(i) * 1.5, 1.5, Math.sin(i) * 1.5) }); } }
  if (tipo === 'numero') { const s = numero(extra.txt, extra.cor); s.position.copy(p).setY(2.2); raiz.add(s); efeitos.push({ obj: s, vida: .8, t: 0, tipo: 'numero' }); }
}
function consumirEventos() {
  for (const ev of b.eventos) {
    const p = ev.x !== undefined ? mundo(ev.x, ev.y) : null;
    if (ev.tipo === 'dano') { const v = vis.get(ev.alvo); if (v) v.flash = .18; const f = vis.get(ev.fonte); if (f && ev.golpe !== 'queima') f.ataque = .25;
      if (p && ev.valor >= 1 && ev.golpe !== 'queima') efeito('numero', p, { txt: Math.round(ev.valor), cor: (ev.golpe === 'firme' || ev.golpe === 'certeiro') ? '#ffe14a' : '#fff' }); }
    if (ev.tipo === 'morte') { const v = vis.get(ev.alvo); if (v) v.morte = 0; if (p) efeito('poeira', p); }
    if (ev.tipo === 'disparo') { const f = vis.get(ev.fonte); if (f) f.ataque = .25; }
    if ((ev.tipo === 'explosao' || ev.tipo === 'meteoro') && p) efeito(ev.tipo, p, ev);
    if (ev.tipo === 'cura' && p) efeito('cura', p);
    if (ev.tipo === 'fim') { document.getElementById('fimtxt').textContent = ev.resultado === 'vitoria' ? '🏆 Vitória!' : '💀 Derrota...'; document.getElementById('fim').style.display = 'flex'; }
  }
  b.eventos.length = 0;
}
function atualizar(dtR) {
  const t = b.t;
  for (const u of b.unidades) {
    const v = obterVis(u); const m = v.m;
    if (u.morto) { if (v.morte < 0) v.morte = 0; v.morte += dtR; m.g.rotation.z = Math.min(1.4, v.morte * 5) * -v.dir; m.g.position.y = -v.morte * .6; m.g.visible = v.morte < 1.2; m.g.children.at(-1).visible = false; continue; }
    if (u.atraso > 0 && t < u.atraso) { m.g.visible = false; continue; }
    m.g.visible = true;
    const alvo = mundo(u.x, u.y); const ant = v.pos.clone(); v.pos.lerp(alvo, Math.min(1, dtR * 12)); m.g.position.copy(v.pos);
    const mov = ant.distanceTo(v.pos) / Math.max(dtR, 1e-3);
    if (u.alvo && !u.alvo.morto) { const ap = mundo(u.alvo.x, u.alvo.y); const ang = Math.atan2(ap.x - v.pos.x, ap.z - v.pos.z); m.g.rotation.y += (((ang - m.g.rotation.y + Math.PI * 3) % (Math.PI * 2)) - Math.PI) * Math.min(1, dtR * 10); }
    v.fase += dtR * (mov > .3 ? 12 : 3);
    const anda = mov > .3 ? 1 : 0;
    m.rig.position.y = Math.abs(Math.sin(v.fase)) * .12 * anda + (u.tipo === 'morcego' ? Math.sin(v.fase * .5) * .15 : 0);
