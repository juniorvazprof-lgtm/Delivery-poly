<style>
/* Layout: casa isométrica à esquerda, roteiro ao vivo à direita (abaixo no celular). Visual único de estúdio à noite. */
:root{
  --bg:#12101c;--panel:#1b1828;--line:#2e2a42;--ink:#f3f0fa;--mut:#a29cb8;
  --gold:#f5c542;--pos:#3fd19a;--neg:#ff5a4f;

  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);margin:0;overflow:hidden}
.app{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:100%}
@media (max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:52% 48%}}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 30%,#2a2440,var(--bg))}

.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--neg);margin-right:6px;animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.2}}
.nm{position:absolute;transform:translate(-50%,-100%);text-align:center;white-space:nowrap}
.nm b{font:600 11px var(--body);padding:1px 6px;border-radius:4px;background:rgba(18,16,28,.75)}
.nm span{display:block;font:500 10px var(--mono);color:var(--mut);margin-top:2px;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.bub{position:absolute;transform:translate(-50%,-100%);width:max-content;max-width:230px;background:#fff;color:#1b1828;font:600 12px/1.35 var(--body);padding:7px 10px;border-radius:10px;animation:pop .25s ease-out;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
.bub.think{background:#2e2a42;color:var(--ink);font-style:italic;font-weight:400}.bub.think::after{border-top-color:#2e2a42}
@keyframes pop{from{transform:translate(-50%,-80%) scale(.6);opacity:0}}
.side{background:var(--panel);border-left:1px solid var(--line);overflow:hidden;padding-block:16px 0;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-rows:auto auto auto minmax(0,1fr);gap:14px;min-height:0}
@media (max-width:820px){.side{border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px))}}
h1{font:800 24px/1 var(--display);margin:0}
.sub{color:var(--mut);margin:6px 0 0;font-size:13px}
.ctrl{display:flex;gap:6px;flex-wrap:wrap}
button{font:600 12px var(--body);color:var(--ink);background:#262238;border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold)}button.on{background:var(--gold);color:#1b1828;border-color:var(--gold)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:8px;padding:8px 10px;display:grid;gap:4px;min-width:0}
.card b{font:800 16px var(--display)}
.card .h{font:500 11px var(--mono);color:var(--mut)}
.meter{height:6px;background:#262238;border-radius:3px;position:relative}
.meter i{position:absolute;top:0;bottom:0;border-radius:3px;transition:all .4s}
.meter::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--mut)}
.card .t{font-size:12px;color:var(--mut);font-style:italic;min-height:3em}
.log{overflow-y:auto;min-height:0;padding-bottom:16px;display:grid;gap:2px;align-content:start}
.ev{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:13px;opacity:.45}
.ev.done{opacity:1}.ev.cur{background:#262238;opacity:1}
.ev time{font:500 11px var(--mono);color:var(--mut);padding-top:2px}
.ev .w{font-weight:600;color:var(--c)}
.ev .d{color:var(--mut);font-size:12px}
@media (prefers-reduced-motion:reduce){.live,.bub{animation:none}}
</style>

<div class="app">

      <h1>Casa a Dois</h1>

    <div class="ctrl">
      <button id="play">⏸ Pausar</button>
      <button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button>
      <button id="restart">Do início</button>
    </div>
    <div class="pair" id="pair"></div>
    <div class="log" id="log"></div>
  </aside>
</div>

const ROOMS = {
  quarto:{x:[-12,-4],z:[-9,-1],col:0x6e5aa8,label:"Quarto"},
  lider:{x:[-12,-4],z:[-1,4],col:0xc9a227,label:"Quarto do Líder"},
  confess:{x:[-12,-4],z:[4,9],col:0xa8323a,label:"Confessionário"},
  sala:{x:[-4,4],z:[-9,1],col:0x8a6a4f,label:"Sala"},
  cozinha:{x:[4,12],z:[-9,1],col:0xd8d2c4,label:"Cozinha"},
  jardim:{x:[-4,12],z:[1,9],col:0x4f9a52,label:"Área externa"},
};
// portas: [salaA, salaB, ponto em A, ponto em B]
const DOORS = [
  ["quarto","sala",[-4.8,-5],[-3.2,-5]],
  ["cozinha","sala",[4.8,-4],[3.2,-4]],
  ["sala","jardim",[0,0.2],[0,1.8]],
  ["cozinha","jardim",[8,0.2],[8,1.8]],
  ["lider","jardim",[-4.8,2.5],[-3.2,2.5]],
  ["confess","jardim",[-4.8,6.5],[-3.2,6.5]],
];
const POOL = {x:[1,8],z:[3.4,7.6]};
function route(a,b){ // BFS entre cômodos
  if(a===b) return [];
  const prev={[a]:null},q=[a];
  while(q.length){const r=q.shift();for(const d of DOORS){let o=null,p1,p2;
    if(d[0]===r){o=d[1];p1=d[2];p2=d[3]}else if(d[1]===r){o=d[0];p1=d[3];p2=d[2]}
    if(o&&!(o in prev)){prev[o]={r,p1,p2};q.push(o)}}}
  const pts=[];let cur=b;while(prev[cur]){pts.unshift(prev[cur].p1,prev[cur].p2);cur=prev[cur].r}return pts;
}
function roomAt(x,z){for(const k in ROOMS){const r=ROOMS[k];if(x>=r.x[0]&&x<=r.x[1]&&z>=r.z[0]&&z<=r.z[1])return k}return "jardim"}
function spot(room){
  const r=ROOMS[room];let x,z,i=0;
  do{x=r.x[0]+1.2+Math.random()*(r.x[1]-r.x[0]-2.4);z=r.z[0]+1.2+Math.random()*(r.z[1]-r.z[0]-2.4);i++}
  while(room==="jardim"&&x>POOL.x[0]-.4&&x<POOL.x[1]+.4&&z>POOL.z[0]-.4&&z<POOL.z[1]+.4&&i<20);
  return [x,z];
}

function pointIn(room,other){
  if(room==="piscina"&&other&&other.room==="piscina"){const q=other.g.position;return [clamp(q.x+(q.x>4.5?-1.5:1.5),POOL.x[0]+.6,POOL.x[1]-.6),clamp(q.z,POOL.z[0]+.6,POOL.z[1]-.6)]}

  if(other&&other.room===room&&!other.path.length){ // chega perto de quem já está lá
    const rr=ROOMS[homeRoom(room)];const p=other.g.position;
    return [clamp(p.x+(Math.random()<.5?1.1:-1.1),rr.x[0]+.8,rr.x[1]-.8),clamp(p.z+(Math.random()<.5?1.1:-1.1),rr.z[0]+.8,rr.z[1]-.8)];
  }

function walk(b,room,other){
  const from=homeRoom(b.room),to=homeRoom(room);
  b.path=[...route(from,to),pointIn(room,other)].map(p=>new THREE.Vector3(p[0],0,p[1]));

}

function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);
  const a=w/h,s=(a<1?17/a:15)*zoom;cam.left=-s*a;cam.right=s*a;cam.top=s;cam.bottom=-s;cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe(canvas);
const v3=new THREE.Vector3();
function place(el,obj,y){v3.set(obj.position.x,y,obj.position.z).project(cam);el.style.left=(v3.x+1)/2*canvas.clientWidth+"px";el.style.top=(1-v3.y)/2*canvas.clientHeight+"px"}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000)*(paused?0:speed);last=now;
  for(const b of bots){
    if(b.path.length){const t=b.path[0],p=b.g.position,dx=t.x-p.x,dz=t.z-p.z,d=Math.hypot(dx,dz),sp=2.6*dt;
      if(d<=sp){p.x=t.x;p.z=t.z;b.path.shift();if(!b.path.length&&b.room==="piscina")b.swim=true}else{p.x+=dx/d*sp;p.z+=dz/d*sp;b.g.rotation.y=Math.atan2(dx,dz)}}
  }
  const [a,b]=bots;if(a.room===b.room&&!a.path.length&&!b.path.length){a.g.rotation.y=Math.atan2(b.g.position.x-a.g.position.x,b.g.position.z-a.g.position.z);b.g.rotation.y=Math.atan2(a.g.position.x-b.g.position.x,a.g.position.z-b.g.position.z)}
  if(dt){wait-=dt;if(wait<=0)next()}
  const t=now/1000;
  for(const x of bots){x.g.position.y=x.swim?-.55+Math.sin(t*2)*.05:(x.path.length?Math.abs(Math.sin(t*10))*.08:0);
    place(x.nm,x.g,x.g.position.y+1.75);if(x.bub)place(x.bub,x.g,x.g.position.y+2.6)}
  const h=parseInt(document.getElementById("clock").textContent)||12,night=h>=19;
  renderer.setClearColor(night?0x14102a:0x2a2440);sun.intensity=night?.4:.85;water.material.emissive.setHex(night?0x1a6aa8:0x0a3a66);
  renderer.render(scene,cam);requestAnimationFrame(frame);
}
resize();jump(0);requestAnimationFrame(frame);
})();
</script>
