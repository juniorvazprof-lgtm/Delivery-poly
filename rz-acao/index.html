<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121815">
<meta name="mobile-web-app-capable" content="yes">
<title>Ressonância Zero — Protótipo de ação</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="view"></canvas>

<div id="hud">
  <div id="hearts" role="img"></div>
  <div id="mats" aria-label="Liga de Fenda"><i></i><b>0</b></div>
  <div id="objective" aria-live="polite"></div>
  <div id="labels"></div>
  <div id="toast" hidden></div>
  <button id="btn-pause" class="hud-btn" aria-label="Pausa"><span class="pause-ico"></span></button>
  <div id="fps" hidden></div>
</div>

<div id="touch">
  <div id="stick"><div id="stick-knob"></div></div>
  <div id="actions">
    <button id="btn-skill" class="act skill" aria-label="Habilidade"><b id="skill-glyph">✦</b><span id="skill-name">Habilidade</span><small id="skill-cd"></small></button>
    <button id="btn-dodge" class="act dodge" aria-label="Esquiva"><b>»</b><span>Esquiva</span></button>
    <button id="btn-attack" class="act attack" aria-label="Ataque"><b>⟋</b><span>Ataque</span></button>
  </div>
</div>

<div id="count" hidden></div>
<div id="fade"></div>
<div id="map" hidden><div class="map-card"><h1>Fenda Verde</h1><p>Escolha o próximo caminho</p><div id="map-area"></div><div id="map-legend"></div></div></div>
<div id="overlay" hidden><div class="card"><h1 id="ov-title"></h1><p id="ov-text"></p><div id="ov-buttons"></div></div></div>
<div id="rotate"><div class="card"><h1>Gire o aparelho</h1><p>Este protótipo é jogado na horizontal.</p></div></div>

<script type="module" src="js/game/main.js"></script>
</body>
</html>
