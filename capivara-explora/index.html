<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1e2b">
<title>Capivara Explora</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="app">
  <!-- ===== Metade de cima: mundo 3D ===== -->
  <section id="stage">
    <canvas id="c"></canvas>
    <div id="hud-day" class="hud">Dia 1</div>
    <div id="hud-brain" class="hud">⚪ Offline</div>
    <div id="hud-time" class="hud">☀️ 07:00</div>
    <div id="flash"></div>
    <div id="emoji" class="emoji"></div>
    <button id="btn-show" class="btn-show" title="Mostrar interface">👁️</button>
  </section>

  <!-- ===== Metade de baixo: painel ===== -->
  <section id="panel">
    <div id="controls">
      <button id="btn-pause" title="Pausar">⏸️</button>
      <button id="btn-speed" title="Velocidade">1x</button>
      <button id="btn-surprise" class="wide">🎁 Surpresa</button>
      <button id="btn-sound" title="Som">🔇</button>
      <button id="btn-hide" title="Ocultar interface">🎬</button>
      <button id="btn-reset" title="Resetar mundo">🔄</button>
      <button id="btn-settings" title="Configurações">⚙️</button>
    </div>
    <div id="tabs">
      <button class="tab active" data-tab="thoughts">🧠 Log</button>
      <button class="tab" data-tab="diary">📖 Diário</button>
      <button class="tab" data-tab="photos">📷 Fotos</button>
      <button class="tab" data-tab="memory">📚 Memória</button>
      <button class="tab" data-tab="status">❤️ Status</button>
    </div>
    <div id="tab-thoughts" class="tabpane active"><div id="log"></div></div>
    <div id="tab-diary" class="tabpane"><div id="diary-list"></div></div>
    <div id="tab-photos" class="tabpane"><div id="photo-grid"></div></div>
    <div id="tab-memory" class="tabpane">
      <h3>Aprendizados</h3><ul id="mem-list"></ul>
      <h3>O que ela acredita</h3><div id="belief-list"></div>
      <h3>Descobertas</h3><div id="disc-list"></div>
    </div>
    <div id="tab-status" class="tabpane">
      <div id="bars"></div>
      <div id="brain-info"></div>
    </div>
  </section>
</div>

<div id="lightbox" class="modal hidden"><figure class="lb"><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure></div>

<!-- ===== Configurações ===== -->
<div id="settings" class="modal hidden">
  <div class="modal-box">
    <h2>⚙️ Configurações</h2>
    <label>Cérebro
      <select id="cfg-mode">
        <option value="deepseek">DeepSeek (IA)</option>
        <option value="gemini">Gemini (IA)</option>
        <option value="offline">Offline (sem API)</option>
      </select>
    </label>
    <div id="cfg-ia">
      <label><span id="cfg-key-lbl">Chave da API</span>
        <input id="cfg-key" type="password" placeholder="cole sua chave aqui" autocomplete="off">
      </label>
      <label>Modelo
        <input id="cfg-model" type="text">
      </label>
    </div>
    <button id="cfg-test" class="test">🔌 Testar chave</button>
    <p class="hint" id="cfg-test-res"></p>
    <p class="hint" id="cfg-hint">A chave fica salva só neste aparelho (localStorage).</p>
    <p class="hint warn" id="cfg-warn"></p>
    <div class="row">
      <button id="cfg-reset" class="danger">🔄 Resetar mundo</button>
      <button id="cfg-close">Salvar</button>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
