<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a14">
<title>Pine Hollow</title>
<link rel="stylesheet" href="css/estilo.css">
<link rel="stylesheet" href="css/inventario.css">
</head>
<body>
<canvas id="view"></canvas>
<div id="topo">
  <div id="hpbar"><div id="hpfill"></div></div>
  <div id="obj"></div>
  <button id="somBtn" aria-label="Som"></button>
</div>
<div id="relogio"></div>
<div id="ganho"></div>
<div id="aviso"></div>
<button id="rest" hidden></button>
<button id="bag" aria-label="Inventory">▦</button>
<div id="radio"></div>
<div id="hurt"></div>
<div id="hold" hidden><div id="holdBar"><div id="holdFill"></div></div><span id="holdTxt"></span></div>
<div id="ammo"></div>
<button id="reload" aria-label="Recarregar">↻</button>
<button id="swap" aria-label="Trocar de arma">⇄</button>
<button id="fire">ATIRAR</button>
<div id="stick"><div id="knob"></div></div>
<button id="lamp"><span><i>◉</i>LANTERNA</span><div id="bat"><div id="batFill"></div></div><em id="pilhas"></em></button>
<button id="flare" aria-label="Sinalizador de mão">✦<b>0</b></button>
<div id="furtivo" hidden>silêncio</div>
<section id="telaContrato" class="tela" hidden></section>
<section id="telaFim" class="tela" hidden></section>
<section id="telaAbrigo" class="tela" hidden></section>
<script type="module" src="js/main.js"></script>
</body>
</html>
